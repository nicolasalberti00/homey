components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    RoomInput:
      additionalProperties: false
      properties:
        description:
          description: Optional description of the room.
          maxLength: 2000
          type: string
        name:
          description: Name of the room, unique across the inventory.
          examples:
            - Garage
          maxLength: 120
          minLength: 1
          type: string
      required:
        - name
      type: object
    RoomPatch:
      additionalProperties: false
      properties:
        description:
          description: New description of the room.
          maxLength: 2000
          type: string
        name:
          description: New name of the room.
          maxLength: 120
          minLength: 1
          type: string
      type: object
    RoomResponse:
      additionalProperties: false
      properties:
        created_at:
          description: When the room was created.
          format: date-time
          type: string
        description:
          examples:
            - Cars and tools
          type: string
        id:
          description: Room ID.
          format: int64
          type: integer
        name:
          examples:
            - Garage
          type: string
        updated_at:
          description: When the room was last updated.
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - created_at
        - updated_at
      type: object
info:
  description: "REST API for homey, the self-hosted home inventory: rooms, nested containers, items and moves."
  title: homey API
  version: 0.1.0
openapi: 3.1.0
paths:
  /rooms:
    get:
      operationId: list-rooms
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RoomResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List rooms
      tags:
        - Rooms
    post:
      operationId: create-room
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a room
      tags:
        - Rooms
  /rooms/{id}:
    delete:
      operationId: delete-room
      parameters:
        - description: Room ID.
          in: path
          name: id
          required: true
          schema:
            description: Room ID.
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an empty room
      tags:
        - Rooms
    get:
      operationId: get-room
      parameters:
        - description: Room ID.
          in: path
          name: id
          required: true
          schema:
            description: Room ID.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a room
      tags:
        - Rooms
    patch:
      operationId: update-room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a room
      tags:
        - Rooms
servers:
  - description: Versioned API root
    url: /api/v1
