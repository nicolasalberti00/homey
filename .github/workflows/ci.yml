name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: tests with coverage
        # -coverpkg makes the profile cross-package: a package counts the
        # coverage its tests get from the tests of other packages too. The
        # "coverage: …% of statements in ./internal/…" lines below are per
        # test binary; the merged, readable numbers come from the next step.
        run: go test -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: coverage threshold
        # Prints the coverage of every package and fails below the minimum
        # (75%, defined in cmd/coverage). This runs inside the required
        # "vet + tests" check, so a drop blocks the merge.
        run: go run ./cmd/coverage -profile coverage.out
      - name: openapi artifact up to date
        run: go run ./cmd/openapi > api/openapi.yaml && git diff --exit-code api/openapi.yaml

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64

  web:
    name: web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: generated API types up to date
        run: npm run api:generate && git diff --exit-code -- src/lib/api/schema.d.ts
      - name: lint (eslint + prettier)
        run: npm run lint
      - name: type check
        run: npm run check
      - name: build
        run: npm run build
