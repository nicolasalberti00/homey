services:
  homey:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: homey:dev
    container_name: homey
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # SQLite database lives here. On Linux hosts make sure the directory is
      # writable by uid 1000: mkdir -p data && sudo chown 1000:1000 data
      - ./data:/data
    environment:
      HOMEY_LOG_FORMAT: json
      # HOMEY_LISTEN: ":8080"
      # HOMEY_CORS_ORIGINS: "https://homey.example.com"
      # HOMEY_MCP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
