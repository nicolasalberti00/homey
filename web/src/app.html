<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>homey</title>
		<script>
			// Apply the stored theme before first paint to avoid a flash of the
			// wrong palette. "system" leaves the attribute unset on purpose.
			try {
				const theme = localStorage.getItem('homey.theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
				}
			} catch {
				// localStorage unavailable: fall back to the system theme
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
